name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require a matching release tag and source versions
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "::error::Release publishing requires a version tag; branch dispatch is not allowed."
            exit 1
          fi
          python scripts/check_release.py --tag "$GITHUB_REF_NAME"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build "twine==7.0.0"
      - name: Build sdist/wheel
        run: python -m build
      - name: Verify built distribution versions
        run: python scripts/check_release.py --tag "$GITHUB_REF_NAME" --dist dist
      - name: Check distribution metadata compatibility
        run: python -m twine check --strict dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: false
          attestations: false # API-token authentication; attestations require Trusted Publishing.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          allow_updates: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
